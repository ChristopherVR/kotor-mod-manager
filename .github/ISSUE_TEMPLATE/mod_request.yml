name: Suggest a mod or a fix to a mod
description: A mod is missing from the library, or an existing mod is set up wrongly.
title: "[Mod] "
labels: ["mod-request"]
body:
  - type: input
    id: mod
    attributes:
      label: Mod name
      placeholder: "Example: Taris Reskin"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the mod page
      description: DeadlyStream, Nexus Mods, or wherever it is hosted.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What would you like?
      options:
        - Add this mod to the library
        - Add this mod to a build
        - Fix how an existing mod is installed
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which game it is for, what it changes, and anything special about installing it (install order, options, other mods it needs).
    validations:
      required: true

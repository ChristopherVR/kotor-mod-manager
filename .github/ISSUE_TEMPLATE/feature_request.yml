name: Suggest an improvement to the app
description: Something the app could do better or do for you.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
      description: Tell us what you are trying to get done, rather than how to build it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would this help?

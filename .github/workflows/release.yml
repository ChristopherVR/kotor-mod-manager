name: Release

# On every push to main: compute the next semver from Conventional Commits
# (git-cliff), regenerate CHANGELOG.md, bump installer/_version.py, tag it, and
# build + publish the release. One workflow run does bump → build → release, so
# it does not depend on a token-pushed tag re-triggering CI.
# Nexus publication follows the successful GitHub release. See nexus/README.md.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Skip the bot's own release commits to avoid loops.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.ver.outputs.release }}
      tag: ${{ steps.ver.outputs.next }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: git-cliff

      - name: Compute next version
        id: ver
        run: |
          # Current version from the single source of truth.
          CUR="$(grep -oP '__version__ = "\K[^"]+' installer/_version.py || echo '0.1.0')"
          # git-cliff returns empty on a repo with zero tags - fall back to CUR.
          RAW="$(git cliff --bumped-version 2>/dev/null | tr -d '[:space:]')"
          RAW="${RAW#v}"
          [ -z "$RAW" ] && RAW="$CUR"
          TAG="v$RAW"
          # Validate strict semver before it ever reaches a shell sink.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Refusing non-semver version: '$TAG'" >&2
            exit 1
          fi
          LAST="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          echo "next=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$LAST" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "First release: $TAG"
          elif [ "$TAG" = "$LAST" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable changes (next=$TAG == last=$LAST)."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $TAG (previous: $LAST)."
          fi

      - name: Regenerate changelog
        if: steps.ver.outputs.release == 'true'
        # Bind through env so shell quoting (not GHA macro expansion) protects the
        # value. Use --tag (we already computed the version) instead of --bump,
        # which errors on a repo with no existing tags.
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: git cliff --tag "$NEXT" -o CHANGELOG.md

      - name: Bump version across the project
        if: steps.ver.outputs.release == 'true'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          VER="${NEXT#v}"
          # Python backend version (shown in app + API)
          cat > installer/_version.py <<EOF
          """Single source of truth for the application version.

          Bumped automatically by the release pipeline (git-cliff). Do not edit by hand.
          """

          __version__ = "$VER"
          EOF
          # Tauri app version (drives the installer/exe version)
          tmp=$(mktemp)
          jq --arg v "$VER" '.version = $v' frontend/src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" frontend/src-tauri/tauri.conf.json
          # Frontend package version
          jq --arg v "$VER" '.version = $v' frontend/package.json > "$tmp" && mv "$tmp" frontend/package.json
          # Rust crate version
          sed -i -E "0,/^version = \".*\"/s//version = \"$VER\"/" frontend/src-tauri/Cargo.toml
          echo "Bumped to $VER"

      - name: Commit, tag, and push
        if: steps.ver.outputs.release == 'true'
        env:
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md installer/_version.py \
            frontend/src-tauri/tauri.conf.json frontend/package.json frontend/src-tauri/Cargo.toml
          git commit -m "chore(release): $NEXT"
          git tag -a "$NEXT" -m "$NEXT"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$NEXT"

  build-release:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      ref: ${{ needs.version.outputs.tag }}
      make_release: true
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write

  nexus:
    name: Nexus (${{ matrix.label }})
    needs: [version, build-release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Keep page-version updates sequential, while allowing the other platform
      # to publish even if one platform's upload fails.
      max-parallel: 1
      matrix:
        include:
          - platform: windows
            label: Windows
            nexus_name: KOTOR Mod Installer (Windows)
            file_id_variable: NEXUS_FILE_ID
            suffix: ''
          - platform: linux
            label: Linux x86_64
            nexus_name: KOTOR Mod Installer (Linux x86_64)
            file_id_variable: NEXUS_LINUX_FILE_ID
            suffix: '-linux'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      PLATFORM: ${{ matrix.platform }}
      PUBLISHED_MARKER: nexus-published${{ matrix.suffix }}.json
      DESCRIPTION_FILE: description${{ matrix.suffix }}.txt
      PACKAGE_SUFFIX: ${{ matrix.suffix }}
      # Nexus limits file display names to 50 characters. Version has its own field.
      NEXUS_DISPLAY_NAME: ${{ matrix.nexus_name }}
    steps:
      - name: Check whether this release already reached Nexus
        id: published
        run: |
          published=$(gh release view "$RELEASE_TAG" --json assets | jq -r --arg marker "$PUBLISHED_MARKER" 'any(.assets[]; .name == $marker)')
          echo "done=$published" >> "$GITHUB_OUTPUT"

      - name: Check Nexus Mods configuration
        if: steps.published.outputs.done != 'true'
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          FILE_ID: ${{ vars[matrix.file_id_variable] }}
          FILE_ID_VARIABLE: ${{ matrix.file_id_variable }}
          WINDOWS_FILE_ID: ${{ vars.NEXUS_FILE_ID }}
          LINUX_FILE_ID: ${{ vars.NEXUS_LINUX_FILE_ID }}
        run: |
          if [ -z "$NEXUSMODS_API_KEY" ] || ! [[ "$FILE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Set secret NEXUSMODS_API_KEY and variable $FILE_ID_VARIABLE (the $PLATFORM manager file group, not the co-op file or mod ID). See nexus/README.md."
            exit 1
          fi
          if [ "$WINDOWS_FILE_ID" = "$LINUX_FILE_ID" ]; then
            echo '::error::Windows and Linux need different Nexus file groups so one platform does not archive the other.'
            exit 1
          fi
          if [ -z "$NEXUS_DISPLAY_NAME" ] || [ "${#NEXUS_DISPLAY_NAME}" -gt 50 ]; then
            echo '::error::Nexus file display names must contain 1 to 50 characters.'
            exit 1
          fi

      # Download the exact release assets so retrying this job needs no rebuild.
      - name: Download the published Nexus package
        if: steps.published.outputs.done != 'true'
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --pattern "kotor-mod-installer-$VERSION$PACKAGE_SUFFIX-nexus.zip" --pattern "$DESCRIPTION_FILE" --dir nexus
          echo "version=$VERSION" >> "$GITHUB_ENV"

      - name: Read the file description
        if: steps.published.outputs.done != 'true'
        id: description
        run: |
          delimiter="NEXUS_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "body<<$delimiter"
            cat "nexus/$DESCRIPTION_FILE"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the standalone manager to Nexus Mods
        if: steps.published.outputs.done != 'true'
        id: upload
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars[matrix.file_id_variable] }}
          filename: nexus/kotor-mod-installer-${{ env.version }}${{ matrix.suffix }}-nexus.zip
          version: ${{ env.version }}
          display_name: ${{ env.NEXUS_DISPLAY_NAME }}
          description: ${{ steps.description.outputs.body }}
          category: main
          allow_mod_manager_download: false
          primary_mod_manager_download: false
          archive_existing_version: true
          update_mod_version: true

      - name: Record the Nexus publication for retries
        if: steps.published.outputs.done != 'true'
        env:
          NEXUS_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          FILE_ID: ${{ vars[matrix.file_id_variable] }}
        run: |
          test -n "$NEXUS_VERSION_ID" || { echo '::error::Nexus returned no version ID'; exit 1; }
          jq -n --arg version "$version" --arg file "$FILE_ID" --arg id "$NEXUS_VERSION_ID" --arg platform "$PLATFORM" \
            '{version: $version, platform: $platform, nexusFileId: $file, nexusVersionId: $id}' > "$PUBLISHED_MARKER"
          gh release upload "$RELEASE_TAG" "$PUBLISHED_MARKER" --clobber
          echo "Published KOTOR Mod Installer $version ($PLATFORM) to Nexus file group $FILE_ID." >> "$GITHUB_STEP_SUMMARY"
